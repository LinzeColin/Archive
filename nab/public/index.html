<style>
/* === MOTION THEME TOKENS === */
:root {
  --stage-bg: #020205;
  --slide-bg: #020205;
  --ink: #fff8ef;
  --muted: rgba(255, 248, 239, .72);
  --dim: rgba(255, 248, 239, .38);
  --red: #e31824;
  --red-soft: rgba(227, 24, 36, .34);
  --cyan: #6ffaff;
  --gold: #e8c47a;
  --green: #76e4ad;
  --panel: rgba(255,255,255,.068);
  --line: rgba(255,255,255,.18);
  --display: "Instrument Serif", serif;
  --body: "IBM Plex Sans", sans-serif;
  --mono: "JetBrains Mono", monospace;
  --px: 0;
  --py: 0;
  --wheel: 0;
  --ease: cubic-bezier(.16,1,.3,1);
}
* { box-sizing: border-box; }
/* ===========================================
   FIXED 16:9 STAGE: MANDATORY BASE STYLES
   Include this ENTIRE file in every presentation.
   Slides are authored at 1920×1080 and scaled as a whole.
   =========================================== */

/* 1. Lock the browser viewport */
html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 2. Full-window deck viewport */
.deck-viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--stage-bg, #000);
}

/* 3. Fixed 16:9 design canvas.
   JavaScript sets transform: translate(...) scale(...). */
.deck-stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    transform-origin: 0 0;
    background: var(--slide-bg, #fff);
}

/* 4. Slides stack inside the fixed stage.
   Content must be laid out at 1920×1080, not reflowed per device. */
.slide {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    display: block;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: var(--slide-bg, #fff);
}

.slide.active,
.slide.visible {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
    z-index: 1;
}

/* 5. Keep media inside authored slide bounds */
img,
video,
canvas,
svg {
    max-width: 100%;
    max-height: 100%;
}

/* 6. Presentation chrome stays outside the slide design system */
.deck-controls {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    z-index: 1000;
}

/* 7. Print one fixed-size slide per page */
@media print {
    html,
    body {
        width: 1920px;
        height: auto;
        overflow: visible;
        background: #fff;
    }

    .deck-viewport {
        position: static;
        overflow: visible;
        background: #fff;
    }

    .deck-stage {
        position: static;
        width: auto;
        height: auto;
        transform: none !important;
        background: none;
    }

    .slide {
        position: relative;
        display: block !important;
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
        width: 1920px;
        height: 1080px;
        break-after: page;
        page-break-after: always;
    }

    .slide:last-child {
        break-after: auto;
        page-break-after: auto;
    }

    .deck-controls {
        display: none !important;
    }
}

/* 8. Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.2s !important;
    }
}

.deck-stage { perspective: 1600px; transform-style: preserve-3d; }
#motionCanvas { position:absolute; inset:0; width:1920px; height:1080px; z-index:0; background:#020205; }

.metric { border:1px solid var(--line); background:linear-gradient(135deg, rgba(255,255,255,.13), rgba(255,255,255,.035)); padding:26px 30px; min-height:138px; backdrop-filter:blur(18px); box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 24px 80px rgba(0,0,0,.22); }

.visual-object { position:absolute; right:106px; top:154px; width:640px; height:640px; transform: translate3d(calc(var(--px) * -46px), calc(var(--py) * -30px), 180px) rotateY(calc(var(--px) * 12deg)) rotateX(calc(var(--py) * -10deg)); }
.glass-core { position:absolute; inset:195px; display:grid; place-items:center; border-radius:50%; font-family:var(--display); font-size:88px; background: radial-gradient(circle at 34% 26%, rgba(111,250,255,.44), rgba(227,24,36,.22) 45%, rgba(3,3,8,.72)); border:1px solid rgba(111,250,255,.48); box-shadow:0 0 80px rgba(111,250,255,.27), inset 0 0 60px rgba(227,24,36,.28); }

@media (prefers-reduced-motion: reduce) { .ring, .flywheel, .flywheel span, .report-ring, .report-node, .report-core, .report-stream { animation:none !important; } }
</style>
